name: tests

on:
    push:
        branches:
            - '**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest]
        steps:
            - uses: actions/checkout@v4.1.7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4.0.3
              with:
                  node-version-file: '.nvmrc'
            # handle NPM / Node.js repeatedly bricking their npm setup on Windows
            # Note that this won't work if it uses --no-save
            - if: runner.os == 'Windows'
              shell: bash
              run: |
                  npm i npm
            # format package.json is to account for the above `npm i npm` command
            - name: run test
              shell: bash
              run: |
                  npm ci
                  npx playwright install --with-deps
                  npm run format package.json
            - name: compile
              run: npm run compile
            - name: test test package
              working-directory: packages/test
              run: npm run test:web
            - name: coverage
              run: npm run test:coverage
            - name: spelling
              run: npm run test:spelling
            - name: format
              run: npm run test:format
            - name: docs
              run: npm run test:docs
            - name: deps
              run: npm run test:deps
            - name: lint
              run: npm run test:lint
